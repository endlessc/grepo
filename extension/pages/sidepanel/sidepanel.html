<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grepo 侧边栏</title>
<link rel="stylesheet" href="../dashboard/app.css">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body class="sp-body">
  <header class="sp-head">
    <div class="sp-brand">
      <div class="brand-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 22 22" width="18" height="18" fill="none">
          <rect x="1" y="1" width="20" height="20" rx="5.5" fill="currentColor"/>
          <path d="M6 7.1h10M6 11h10M6 14.9h5.4" stroke="var(--logo-stroke, #ffffff)" stroke-width="1.6" stroke-linecap="round" opacity="0.94"/>
          <circle class="mark-dot" cx="15.6" cy="14.9" r="1.55"/>
        </svg>
      </div>
      <span class="sp-title">grepo</span>
      <span class="sp-count" id="spCount"></span>
    </div>
    <button type="button" class="btn sp-open-main" id="spOpenMain" title="打开 grepo 主界面">主界面</button>
  </header>

  <!-- 当检测到当前标签页是 GitHub 仓库时展示上下文卡片 -->
  <section id="spContext" class="sp-section hidden">
    <div class="sp-card">
      <div class="sp-repo-head">
        <div class="sp-repo-title-wrap">
          <div class="sp-repo-owner" id="spOwner"></div>
          <h2 class="sp-repo-name" id="spRepo"></h2>
        </div>
        <button type="button" class="btn btn-star sp-star-btn" id="spStarBtn">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M8 1.9l1.92 3.9 4.3.63-3.11 3.03.73 4.28L8 11.72l-3.84 2.02.73-4.28L1.78 6.43l4.3-.63z"/>
          </svg>
          <span>Star</span>
        </button>
      </div>
      <p class="sp-repo-desc" id="spDesc"></p>

      <div id="spAnnotateWrap" class="sp-annotate">
        <label class="sp-field">
          <span>本地标签（空格分隔）</span>
          <input id="spTags" type="text" placeholder="cli rust tools" autocomplete="off" spellcheck="false">
        </label>
        <label class="sp-field">
          <span>个人备注（仅存本地，支持搜索）</span>
          <textarea id="spNote" rows="2" placeholder="记录收藏原因、用法或替代方案…"></textarea>
        </label>
        <div class="sp-annotate-actions">
          <button type="button" class="btn btn-primary sp-save-btn" id="spSaveMeta">保存备注与标签</button>
          <span class="sp-saved-tip" id="spSavedTip"></span>
        </div>
      </div>

      <div class="sp-ext-links" id="spExtLinks"></div>
    </div>

    <div class="sp-block">
      <div class="sp-block-head">
        <span>本地相似收藏</span>
        <span class="sp-block-sub" id="spSimCount"></span>
      </div>
      <div class="sp-list" id="spSimilar"></div>
    </div>
  </section>

  <!-- 迷你全局搜索区（任何页面均可秒搜本地库） -->
  <section class="sp-section">
    <div class="sp-block-head">
      <span>本地速搜</span>
      <span class="sp-block-sub">支持 lang: / tag: / 备注</span>
    </div>
    <div class="sp-search">
      <input id="spSearchInput" type="search" placeholder="搜索我的 4,000+ 收藏…" autocomplete="off" spellcheck="false">
    </div>
    <div class="sp-list" id="spSearchResults"></div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
